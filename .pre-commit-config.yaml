# Pre-commit hooks configuration
# See https://pre-commit.com for more information

default_language_version:
  python: python3

repos:
  # ---------- CORE HYGIENE ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # File formatting
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]

      # Python-specific
      - id: check-ast
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]

      # Merge conflicts and syntax
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

      # Security
      - id: detect-private-key

      # Check requirements.txt files are sorted
      - id: requirements-txt-fixer
        files: requirements.*\.txt$

  # ---------- PYTHON LINT + FORMAT (Ruff) ----------
  # Ruff replaces flake8, isort, pyupgrade, and black (via ruff-format) —
  # [tool.ruff] in pyproject.toml already enables the "I" (isort) and "UP"
  # (pyupgrade) rule sets, so standalone isort/pyupgrade/black hooks would
  # just be doing the same work twice.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]

      - id: ruff-format
        types_or: [python, pyi]

  # ---------- DOCSTRING STYLE ----------
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args:
          - --convention=google
          - --add-ignore=D100,D101,D102,D103,D104,D105,D107,D212
        exclude: ^(tests/|setup\.py|docs/)

  # ---------- TYPES (MYPY) ----------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        files: ^(visdrone_toolkit|scripts)/
        args:
          - --ignore-missing-imports
          - --check-untyped-defs
          - --pretty
        additional_dependencies:
          - types-PyYAML
          - types-setuptools
          - types-requests

  # ---------- SECURITY (Bandit) ----------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.2
    hooks:
      - id: bandit
        files: ^(visdrone_toolkit|scripts)/
        args:
          - -c
          - pyproject.toml
          - --confidence-level
          - medium
        additional_dependencies: ["bandit[toml]"]

  # ---------- DOCS/CONFIG FORMATTING ----------
  # Prettier - Format YAML, JSON, Markdown, etc.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, markdown, json]
        exclude: ^(CHANGELOG\.md|LICENSE)$

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint-fix
        args: [--disable, MD013, MD033, MD041, MD024, --]

  # YAML linting — reads the checked-in .yamllint config
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--config-file=.yamllint]

  # ---------- SHELL SCRIPTS ----------
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: \.sh$

  # ---------- COMMIT MESSAGE POLICY ----------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

# Configuration for specific hooks can also be in pyproject.toml

# ---------- CI / PRE-COMMIT.CI CONFIG ----------
# No-op unless this repo is enrolled at https://pre-commit.ci
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: []
  submodules: true
